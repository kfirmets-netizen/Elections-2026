<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1249d8">
  <title>עד 120</title>
  <meta name="description" content="משחק תחזיות לבחירות בישראל — התחזיות נשארות חסויות עד מועד החשיפה">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231249d8'/%3E%3Cpath d='M15 31h34v21H15z' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M22 21h20l7 10H15z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#101828;--muted:#5d6b7e;--blue:#1249d8;--blue2:#0b36a7;--line:#dfe5ee;--bg:#f5f7fb;--good:#116033;--bad:#b42318;--shadow:0 16px 50px #26376212}
    *{box-sizing:border-box}html{background:var(--bg);direction:rtl}body{margin:0;color:var(--ink);font:16px/1.45 Arial,"Noto Sans Hebrew",sans-serif;background:radial-gradient(circle at 10% 0,#dce7ff 0,transparent 34%),var(--bg);min-height:100vh}
    button,input{font:inherit}button{border:0;font-weight:800;cursor:pointer}.shell{min-height:100dvh;max-width:600px;margin:auto;padding:24px 18px 80px}.home{display:flex;flex-direction:column;justify-content:center}.hidden{display:none!important}
    .brand{margin:0 auto 28px;width:min(100%,360px)}.logoLockup{display:flex;align-items:center;justify-content:center;gap:18px;direction:rtl}.logoIcon{display:block;width:112px;height:112px;flex:none}.wordmark{font-size:58px;line-height:1;font-weight:900;white-space:nowrap}.hero,.panel{background:#fff;border:1px solid #e6eaf1;border-radius:26px;padding:24px;box-shadow:var(--shadow)}.hero h1{font-size:32px;line-height:1.12;margin:0 0 12px}.hero p{color:var(--muted);margin:0 0 25px}.primary{width:100%;padding:16px;border-radius:15px;background:var(--blue);color:#fff;box-shadow:0 8px 20px #1148d82e}.primary:hover{background:var(--blue2)}button:disabled{opacity:.42;cursor:not-allowed}.join{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-top:12px}.join button,.share{border:1px solid var(--line);border-radius:13px;background:#fff}.join input,input{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fbfcfe;min-width:0}.features{display:flex;justify-content:space-between;gap:8px;margin-top:22px;color:var(--muted);font-size:12px;font-weight:700}.back{background:none;margin-bottom:18px;color:var(--muted);padding:7px 0}.panel h1{font-size:30px;margin:4px 0 24px}.panel h2{margin:5px 0 16px}.stack{display:grid;gap:17px}label{display:grid;gap:8px;font-size:14px;font-weight:700}.notice{background:#eef3ff;color:#24499c;padding:14px;border-radius:13px;font-size:13px}.localNotice{margin:0 0 14px;background:#fff7db;color:#755600;border:1px solid #f3dc80;padding:12px 14px;border-radius:13px;font-size:13px}.error{color:var(--bad);font-weight:700}.roomHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.roomHead h1{font-size:30px;margin:2px 0}.roomHead small,small{font-size:13px;color:#64748b;font-weight:700}.share{padding:11px 16px}.status{display:flex;gap:13px;align-items:center;border-radius:20px;padding:16px;margin-bottom:14px}.sealed{background:var(--ink);color:#fff}.waiting{background:#fff7db;color:#755600}.open{background:#e9f9ef;color:var(--good)}.status .icon{width:42px;height:42px;border-radius:13px;background:#ffffff18;display:grid;place-items:center;font-size:24px}.status div{display:grid;gap:4px}.status span{font-size:13px;opacity:.75}.prediction{padding:14px}.prediction>.nameField{margin:8px 5px 16px}.parties{display:grid;gap:7px}.party{grid-template-columns:30px 1fr auto;display:grid;align-items:center;gap:10px;padding:9px;border:1px solid #e7ebf1;border-radius:15px}.number{width:29px;height:29px;background:#edf2ff;color:var(--blue);display:grid;place-items:center;border-radius:9px;font-size:12px}.step{display:grid;grid-template-columns:35px 42px 35px;direction:ltr;border:1px solid var(--line);border-radius:11px;overflow:hidden}.step button{background:#f5f7fa;font-size:20px}.step input{border:0;border-radius:0;text-align:center;padding:8px 0;width:42px;font-weight:900;background:#fff}.total{position:sticky;bottom:79px;display:flex;justify-content:space-between;margin:14px 0 9px;padding:13px 16px;background:#fff3f0;color:var(--bad);border-radius:13px;border:1px solid #ffd4cc;z-index:2}.total.good{background:#e9f9ef;color:var(--good);border-color:#b9e7c8}.sticky{position:sticky;bottom:14px;z-index:2}.adminResult{width:100%;margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;color:#536071}.toast{position:fixed;z-index:30;bottom:18px;left:18px;right:18px;max-width:564px;margin:auto;background:var(--ink);color:#fff;padding:14px;border-radius:14px;text-align:center;box-shadow:0 10px 30px #10182844}.cards,.ranking{display:grid;gap:10px;margin:18px 0}.cards details,.rank{border:1px solid var(--line);border-radius:15px;padding:14px}.cards summary{font-weight:900;cursor:pointer}.cards p{display:flex;justify-content:space-between;margin:10px 0;color:var(--muted)}.rank{display:grid;grid-template-columns:38px 1fr auto;align-items:center}.rank .place{width:32px;height:32px;border-radius:50%;background:#fff1be;color:#855d00;display:grid;place-items:center}.rank span{font-size:13px;color:#64748b}.matrix{display:grid;gap:8px;margin-top:14px}.matrix>div{display:grid;grid-template-columns:1.3fr .8fr;gap:4px;border-bottom:1px solid var(--line);padding:10px 0}.matrix em{color:#64748b;font-size:13px;font-style:normal}.modal{position:fixed;inset:0;background:#10182899;z-index:20;display:grid;place-items:end center;padding:18px}.modal>.panel{width:min(100%,564px);max-height:91dvh;overflow:auto}.close{float:left;background:#eef1f6;border-radius:50%;width:36px;height:36px;font-size:23px}.compact .party{grid-template-columns:1fr 72px}.compact input{text-align:center;padding:8px}.loading{text-align:center;padding-top:35vh;color:#64748b}.empty{color:var(--muted);text-align:center;padding:20px}.adminLink{margin-top:14px;padding:13px;border-radius:13px;background:#fff7db;color:#755600;font-size:13px;word-break:break-word}
    @media(max-width:380px){.shell{padding-inline:12px}.hero h1{font-size:27px}.logoIcon{width:86px;height:86px}.wordmark{font-size:46px}.party{grid-template-columns:26px 1fr auto}.step{grid-template-columns:31px 38px 31px}.features{flex-direction:column}.roomHead h1{font-size:25px}}
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
  (()=>{
    "use strict";
    const PARTIES=["ביחד","הדמוקרטים","המשותפת","הציונות הדתית","הליכוד","יהדות התורה","ישר!","ישראל ביתנו","עוצמה יהודית","עמך ישראל","רע״ם","ש״ס"];
    const API_BASE=(window.ELECTIONS_API_BASE||"").replace(/\/$/,"");
    const state={screen:"home",code:"",room:null,name:"",seats:blank(),message:"",busy:false,admin:"",resultMode:false};
    const app=document.getElementById("app");
    function blank(){return Object.fromEntries(PARTIES.map(p=>[p,0]))}
    function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function total(){return Object.values(state.seats).reduce((a,b)=>a+(Number(b)||0),0)}
    function localWarning(){return location.protocol==="file:"?'<div class="localNotice">זו תצוגה מקומית. כדי ליצור חדר ולשמור תחזיות צריך לחבר את הקובץ לענן.</div>':""}
    function logo(){return `<div class="logoLockup" role="img" aria-label="עד 120"><span class="wordmark">עד 120</span><svg class="logoIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" aria-hidden="true"><rect width="140" height="140" rx="36" fill="#1249d8"/><path d="M36 71h68v43H36z" fill="none" stroke="#fff" stroke-width="8" stroke-linejoin="round"/><path d="M50 53h42l12 18H36z" fill="#fff"/><text x="70" y="102" text-anchor="middle" font-family="Arial,sans-serif" font-size="29" font-weight="900" fill="#1249d8">120</text></svg></div>`}
    function partyList(compact=false){return `<div class="parties ${compact?"compact":""}">${PARTIES.map((p,i)=>`<label class="party">${compact?"":`<span class="number">${i+1}</span>`}<strong>${p}</strong>${compact?`<input class="seatInput" data-party="${p}" inputmode="numeric" type="number" min="0" max="120" value="${state.seats[p]}">`:`<span class="step"><button type="button" data-action="minus" data-party="${p}" aria-label="הפחתה מ${p}">−</button><input class="seatInput" data-party="${p}" inputmode="numeric" type="number" min="0" max="120" value="${state.seats[p]}" aria-label="מנדטים ל${p}"><button type="button" data-action="plus" data-party="${p}" aria-label="הוספה ל${p}">+</button></span>`}</label>`).join("")}</div>`}
    function totalBox(){const n=total();return `<div class="total ${n===120?"good":""}"><span>סה״כ</span><strong>${n} / 120</strong></div>`}
    function render(){
      if(state.screen==="home") app.innerHTML=`<section class="shell home"><div class="brand">${logo()}</div><section class="hero">${localWarning()}<h1>מי באמת יודע לקרוא את המפה?</h1><p>כל אחד ממלא תחזית, וכל התחזיות נשארות חסויות עד לרגע החשיפה.</p><button class="primary" data-action="goCreate">פתיחת משחק חדש</button><div class="join"><input id="joinCode" value="${esc(state.code)}" placeholder="קוד חדר" maxlength="6" autocapitalize="characters"><button data-action="join">כניסה</button></div>${state.message?`<p class="error">${esc(state.message)}</p>`:""}</section><div class="features"><span>🔒 חסוי מהמארגן</span><span>✓ בדיוק 120</span><span>🏆 דירוג אוטומטי</span></div></section>`;
      else if(state.screen==="create") app.innerHTML=`<section class="shell"><button class="back" data-action="home">→ חזרה</button><section class="panel">${localWarning()}<small>יצירת חדר</small><h1>פותחים את הקלפי</h1><form id="createForm" class="stack"><label>שם המשחק<input name="title" value="תחזית הבחירות שלנו" maxlength="80" required></label><label>מועד אחרון להגשת תחזיות<input id="closeAt" name="closeAt" type="datetime-local" required></label><label>מועד חשיפת התחזיות והדירוג<input id="revealAt" name="revealAt" type="datetime-local" required></label><div class="notice">לאחר מועד ההגשה לא ניתן יהיה לשמור או לשנות תחזית. עד מועד החשיפה אף אחד — כולל המארגן — לא יוכל לצפות בתחזיות.</div><button class="primary" ${state.busy?"disabled":""}>${state.busy?"פותח חדר…":"יצירת חדר פרטי"}</button></form>${state.message?`<p class="error">${esc(state.message)}</p>`:""}</section></section>`;
      else if(state.screen==="loading") app.innerHTML='<section class="shell loading">טוען את החדר…</section>';
      else renderRoom();
      bind();
    }
    function renderRoom(){const r=state.room;if(!r){state.screen="home";return render()}const ranked=r.results&&r.predictions?[...r.predictions].map(x=>({...x,error:PARTIES.reduce((s,p)=>s+Math.pow((x.seats[p]||0)-(r.results[p]||0),2),0)})).sort((a,b)=>a.error-b.error):[];
      let body="";
      if(!r.revealed&&!r.closed){const n=total();body=`<form id="predictionForm" class="panel prediction"><label class="nameField">השם שלך<input id="playerName" value="${esc(state.name)}" placeholder="איך תופיע בדירוג?" maxlength="40" required></label>${partyList()}${totalBox()}<button class="primary sticky" ${state.busy||n!==120?"disabled":""}>${n===120?"נעילת התחזית":`נותרו ${120-n} מנדטים`}</button></form>${state.admin?'<button class="adminResult" data-action="results">הזנת תוצאות האמת מראש</button>':""}`}
      else if(!r.revealed){body=`<section class="panel"><h2>הגשת התחזיות הסתיימה</h2><p class="empty">התחזיות יישארו חסויות עד ${new Date(r.revealAt).toLocaleString("he-IL")}.</p>${state.admin?'<button class="primary" data-action="results">הזנת תוצאות האמת</button>':""}</section>`}
      else if(r.results){body=`<section class="panel"><small>הציון הוא סכום ריבועי הסטיות — הנמוך ביותר מנצח</small><h2>לוח המנצחים</h2><div class="ranking">${ranked.length?ranked.map((x,i)=>`<div class="rank"><b class="place">${i+1}</b><strong>${esc(x.name)}</strong><span>${x.error} נק׳</span></div>`).join(""):'<p class="empty">עדיין אין תחזיות בחדר</p>'}</div><details><summary>השוואה מלאה</summary><div class="matrix">${PARTIES.map(p=>`<div><strong>${p}</strong><span>אמת: ${r.results[p]||0}</span>${ranked.map(x=>`<em>${esc(x.name)}: ${x.seats[p]||0}</em>`).join("")}</div>`).join("")}</div></details></section>`}
      else{body=`<section class="panel"><h2>כל התחזיות על השולחן</h2><div class="cards">${r.predictions?.length?r.predictions.map(x=>`<details><summary>${esc(x.name)}</summary>${PARTIES.map(p=>`<p><span>${p}</span><b>${x.seats[p]||0}</b></p>`).join("")}</details>`).join(""):'<p class="empty">עדיין אין תחזיות בחדר</p>'}</div>${state.admin?'<button class="primary" data-action="results">הזנת תוצאות האמת</button>':""}</section>`}
      const statusClass=r.revealed?"open":r.closed?"waiting":"sealed",statusIcon=r.revealed?"✓":r.closed?"⏳":"⌁",statusTitle=r.revealed?"התחזיות נחשפו":r.closed?"ההגשה נסגרה":"הכספת נעולה",statusText=r.revealed?`${r.count} תחזיות במשחק`:r.closed?`החשיפה: ${new Date(r.revealAt).toLocaleString("he-IL")}`:`הגשה עד ${new Date(r.closeAt).toLocaleString("he-IL")} · חשיפה ${new Date(r.revealAt).toLocaleString("he-IL")}`;
      app.innerHTML=`<section class="shell"><button class="back" data-action="home">→ חזרה למסך הראשי</button><header class="roomHead"><div><small>חדר ${esc(r.code)}</small><h1>${esc(r.title)}</h1></div><button class="share" data-action="share">שיתוף</button></header><section class="status ${statusClass}"><span class="icon">${statusIcon}</span><div><strong>${statusTitle}</strong><span>${statusText}</span></div></section>${body}${state.message?`<div class="toast">${esc(state.message)}</div>`:""}${state.resultMode?`<div class="modal"><section class="panel"><button class="close" data-action="close">×</button><h2>תוצאות האמת</h2>${!r.revealed?'<div class="notice">התוצאות יישמרו, אך התחזיות והדירוג יישארו חסויים עד למועד שנקבע.</div>':""}${partyList(true)}${totalBox()}<button class="primary" data-action="saveResults" ${state.busy||total()!==120?"disabled":""}>שמירת התוצאות</button></section></div>`:""}</section>`;
    }
    function bind(){
      app.querySelectorAll("[data-action]").forEach(el=>el.addEventListener("click",handleAction));
      app.querySelectorAll(".seatInput").forEach(el=>el.addEventListener("input",e=>{state.seats[e.target.dataset.party]=Math.max(0,Math.min(120,Number(e.target.value)||0));render()}));
      const jc=document.getElementById("joinCode");if(jc)jc.addEventListener("input",e=>state.code=e.target.value.toUpperCase());
      const nf=document.getElementById("playerName");if(nf)nf.addEventListener("input",e=>state.name=e.target.value);
      const cf=document.getElementById("createForm");if(cf)cf.addEventListener("submit",createRoom);
      const pf=document.getElementById("predictionForm");if(pf)pf.addEventListener("submit",savePrediction);
      const close=document.getElementById("closeAt"),reveal=document.getElementById("revealAt");if(close&&reveal&&!close.value){const localValue=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)},now=Date.now();close.min=localValue(now+60000);close.value=localValue(now+86400000);reveal.min=close.value;reveal.value=localValue(now+90000000);close.addEventListener("change",()=>{reveal.min=close.value;if(reveal.value<=close.value){const d=new Date(close.value);d.setHours(d.getHours()+1);reveal.value=localValue(d)}})}
    }
    async function handleAction(e){const a=e.currentTarget.dataset.action,p=e.currentTarget.dataset.party;if(a==="goCreate"){state.screen="create";state.message="";render()}else if(a==="home"){state.screen="home";state.room=null;state.resultMode=false;state.message="";history.replaceState({},"",location.pathname);render()}else if(a==="join")loadRoom(state.code);else if(a==="plus"||a==="minus"){state.seats[p]=Math.max(0,state.seats[p]+(a==="plus"?1:-1));render()}else if(a==="results"){state.seats=blank();state.resultMode=true;render()}else if(a==="close"){state.resultMode=false;render()}else if(a==="saveResults")saveResults();else if(a==="share")shareRoom()}
    async function api(path,options){if(location.protocol==="file:"&&!API_BASE)throw Error("הקובץ עדיין לא מחובר לענן");const res=await fetch(API_BASE+path,options),data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||"אירעה שגיאה");return data}
    async function createRoom(e){e.preventDefault();const f=new FormData(e.currentTarget),title=f.get("title"),closeValue=String(f.get("closeAt")),revealValue=String(f.get("revealAt")),closeAt=Date.parse(closeValue),revealAt=Date.parse(revealValue);if(!Number.isFinite(closeAt)||!Number.isFinite(revealAt)||revealAt<=closeAt){state.message="מועד החשיפה חייב להיות אחרי מועד סגירת ההגשות";return render()}state.busy=true;state.message="";render();try{const d=await api("/api/rooms",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({title,closeAt:new Date(closeAt).toISOString(),revealAt:new Date(revealAt).toISOString()})});state.code=d.code;state.admin=d.adminToken;localStorage.setItem(`ad120-admin-${d.code}`,d.adminToken);history.replaceState({},"",`?room=${d.code}`);await loadRoom(d.code,d.adminToken)}catch(err){state.message=err.message;state.busy=false;state.screen="create";render()}}
    async function loadRoom(code,admin=""){if(!code?.trim()){state.message="יש להזין קוד חדר";return render()}state.busy=true;state.screen="loading";render();try{const c=code.trim().toUpperCase(),savedAdmin=localStorage.getItem(`ad120-admin-${c}`)||"",d=await api(`/api/rooms/${encodeURIComponent(c)}`,{cache:"no-store"});state.code=c;state.admin=admin||savedAdmin;state.room=d;state.screen="room";state.message="";if(state.admin)localStorage.setItem(`ad120-admin-${c}`,state.admin);if(location.protocol!=="file:")history.replaceState({},"",`?room=${c}`)}catch(err){state.message=err.message;state.screen="home"}finally{state.busy=false;render()}}
    async function savePrediction(e){e.preventDefault();if(total()!==120||!state.name.trim())return;state.busy=true;render();try{const key=`ad120-${state.code}`,editToken=localStorage.getItem(key)||undefined,d=await api(`/api/rooms/${state.code}/predictions`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({name:state.name,seats:state.seats,token:editToken})});localStorage.setItem(key,d.token);state.message="התחזית נשמרה בכספת. אפשר לעדכן עד מועד סגירת ההגשות.";await loadRoom(state.code,state.admin)}catch(err){state.message=err.message;state.busy=false;render()}}
    async function saveResults(){if(total()!==120)return;state.busy=true;render();try{await api(`/api/rooms/${state.code}/results`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({adminToken:state.admin,seats:state.seats})});state.resultMode=false;state.message="תוצאות האמת נשמרו";await loadRoom(state.code,state.admin)}catch(err){state.message=err.message;state.busy=false;render()}}
    async function shareRoom(){const url=`${location.origin}${location.pathname}?room=${state.room.code}`;try{if(navigator.share)await navigator.share({title:state.room.title,url});else{await navigator.clipboard.writeText(url);state.message="הקישור הועתק";render()}}catch{}}
    const qs=new URLSearchParams(location.search),c=qs.get("room"),a=qs.get("admin")||"";if(c){state.code=c.toUpperCase();if(a)localStorage.setItem(`ad120-admin-${state.code}`,a);loadRoom(state.code,a)}else render();
    setInterval(()=>{if(!state.room||state.resultMode)return;const now=Date.now(),shouldClose=!state.room.closed&&now>=Date.parse(state.room.closeAt),shouldReveal=!state.room.revealed&&now>=Date.parse(state.room.revealAt);if(shouldClose||shouldReveal)loadRoom(state.code,state.admin)},5000);
  })();
  </script>
</body>
</html>
